name: security

# Runs on every push. The point of this pipeline is regression prevention: if a
# future change re-introduces a price field, a Math.random token, or a known
# CVE, the build fails here instead of in production.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: backend tests + audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        # requirements-dev.txt pulls in requirements.txt plus test-only tools.
        # The runtime list stays separate and minimal on purpose.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Validation-layer attack tests
        run: python -m tests.test_security

      - name: Crypto attack tests
        # scrypt is deliberately slow; give it room on a cold runner.
        run: python -m tests.test_crypto

      - name: Upload + OTP abuse tests
        run: python -m tests.test_uploads_otp

      - name: Token forgery + payment webhook tests
        run: python -m tests.test_tokens_payments

      - name: Log redaction + route-protection tests
        # Includes proof that the route auditor can actually fail, so a guard
        # that always passes cannot masquerade as a guard.
        run: python -m tests.test_auth_redaction

      - name: Dependency audit
        run: pip-audit --progress-spinner off

      - name: Fails if a known-vulnerable JWT library is pinned
        # PyJWT 2.10.1 and earlier carry PYSEC-2026-176/177/178/179.
        run: |
          pinned=$(grep -i '^pyjwt' requirements.txt | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "pinned PyJWT: $pinned"
          case "$pinned" in
            2.1[3-9].*|2.[2-9][0-9].*|[3-9].*) echo "guardrail holds" ;;
            *) echo "::error::PyJWT $pinned is below 2.13.0 and has known advisories"; exit 1 ;;
          esac

      - name: Pricing and menu-drift tests
        # Also parses frontend/lib/menu.ts, so a price edited in one place but
        # not the other fails the build.
        run: python -m tests.test_pricing

      - name: Import check
        # This also runs enforce_route_protection(). If a route is ever added
        # without an auth dependency and without an allowlist entry, the import
        # raises and this step fails. Forgetting auth is a build break.
        run: python -c "import app.main"

      - name: Fails if production can boot without a real secret
        run: |
          if ENVIRONMENT=production python -c "import app.config" 2>/dev/null; then
            echo "::error::app.config booted in production with the placeholder JWT secret"
            exit 1
          fi
          echo "guardrail holds: production refuses the placeholder secret"

      - name: Fails if production accepts a weak secret
        # 31 characters: long enough to look deliberate, short enough to be
        # brute-forced. app/config.py must refuse to boot in production.
        run: |
          if ENVIRONMENT=production JWT_SECRET="$(printf 'x%.0s' {1..31})" \
             python -c "import app.config" 2>/dev/null; then
            echo "::error::production booted with a JWT secret under 32 characters"
            exit 1
          fi
          echo "guardrail holds: production refuses a secret under 32 characters"

  frontend:
    name: frontend audit + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm ci --no-audit

      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=moderate

      - name: Type check and build
        run: npm run build

      - name: Fails if a production build exposes the mock admin
        run: |
          for f in .next/server/app/admin.html .next/server/app/staff.html; do
            if [ -f "$f" ] && ! grep -q "is disabled" "$f"; then
              echo "::error::$f does not contain the mock gate - admin is reachable"
              exit 1
            fi
          done
          echo "guardrail holds: mock admin blocked in production build"
